[package]
name = "haze-core"
version = "0.1.0"
description = "Lo que comparten Haze de escritorio y Haze para Android: cola, ajustes y reproductor"
edition = "2021"

[dependencies]
# "rc": la cola y el estado serializan `Arc<Song>`.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
