[package]
name = "haze-core"
version = "0.1.0"
description = "Lo que comparten Haze de escritorio y Haze para Android: cola, ajustes y reproductor"
edition = "2021"

[dependencies]
# "rc": la cola y el estado serializan `Arc<Song>`.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# Sin TLS: la conexion es TCP plana y rustls con aws-lc no compila facil para Android.
rumqttc = { version = "0.25", default-features = false, optional = true }
lofty = { version = "0.25", optional = true }
walkdir = { version = "2", optional = true }
# Sincronizar con el server de casa: HTTP plano, sin TLS (ver arriba y sync.rs).
ureq = { version = "3", default-features = false, features = ["json"], optional = true }

[features]
# Home Assistant por MQTT.
mqtt = ["dep:rumqttc", "tokio/rt", "tokio/time", "tokio/macros"]
# Recorrer carpetas y leer tags y tapas (escritorio y el server de la tele).
library = ["dep:lofty", "dep:walkdir"]
# Bajar y subir musica y juntar las listas con el server (escritorio y Android).
sync = ["dep:ureq"]
