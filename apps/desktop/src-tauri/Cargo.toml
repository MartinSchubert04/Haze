[package]
name = "haze"
version = "0.1.2"
description = "Haze: reproductor de musica liviano para escritorio"
edition = "2021"

[lib]
name = "haze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
haze-core = { path = "../../../crates/haze-core", features = ["mqtt"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt", "process"] }
lofty = "0.25"
walkdir = "2"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.24"
url = "2"
percent-encoding = "2"
log = "0.4"
# Bot de Discord (apagado por defecto): solo arranca si se prende en Ajustes.
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "voice"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "serenity", "rustls", "tungstenite"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "ogg", "vorbis", "wav", "pcm", "mkv"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Media",
  "Media_Playback",
  "Storage",
  "Storage_Streams",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
] }
