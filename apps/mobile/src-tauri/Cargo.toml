[package]
name = "haze-mobile"
version = "0.1.0"
description = "Haze para Android"
edition = "2021"

[lib]
name = "haze_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
haze-core = { path = "../../../crates/haze-core", features = ["mqtt"] }
tauri-plugin-haze-player = { path = "../../../plugins/haze-player" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
log = "0.4"
