[package]
name = "haze"
version = "0.1.0"
description = "Haze: reproductor de musica liviano para escritorio"
edition = "2021"

[lib]
name = "haze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt", "process"] }
lofty = "0.25"
walkdir = "2"
rumqttc = "0.25"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.24"
url = "2"
percent-encoding = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Media",
  "Media_Playback",
  "Storage",
  "Storage_Streams",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Security",
] }

[profile.release]
# Binario chico: es lo que queda corriendo de fondo.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
