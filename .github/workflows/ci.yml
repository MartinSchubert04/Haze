name: CI

# - En cada push y PR: tests de Rust y chequeo de tipos de la interfaz.
# - Al etiquetar vX.Y.Z: compila el instalador de Windows y lo publica en Releases.
#
#     git tag v0.2.0
#     git push origin v0.2.0
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests y build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Los tags solo pueden leer la cache de main: por eso main la deja con lo de
      # release ya compilado (ver "Calentar cache") y el tag compila solo Haze.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # En los tags no se repiten: ya corrieron con el push a main.
      - name: Chequeo de tipos
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run check

      - name: Tests de Rust
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: src-tauri
        run: cargo test

      - name: Calentar cache de release
        if: github.ref == 'refs/heads/main'
        run: npx tauri build --no-bundle

      - name: Version desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "El tag '$GITHUB_REF_NAME' no tiene la forma vMAYOR.MENOR.PARCHE" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Instalador
        if: steps.version.outputs.version
        shell: bash
        env:
          # Clave privada de las actualizaciones (Settings > Secrets > Actions). Sin ella
          # el instalador sale igual, pero las apps instaladas no se pueden actualizar solas.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # La version sale del tag: se escribe en los dos lugares donde vive.
          sed -i "s/^version = \".*\"/version = \"$V\"/" src-tauri/Cargo.toml
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then FIRMA=true; else FIRMA=false
            echo "::warning::Falta el secret TAURI_SIGNING_PRIVATE_KEY: esta version no se ofrece como actualizacion automatica."
          fi
          npx tauri build --config "{\"version\":\"$V\",\"bundle\":{\"createUpdaterArtifacts\":$FIRMA}}"

      - name: Publicar el Release
        if: steps.version.outputs.version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          cp "$SETUP" "Haze-$V-setup.exe"
          ARCHIVOS="Haze-$V-setup.exe"

          # latest.json: lo que consultan las apps instaladas para actualizarse solas.
          if [ -f "$SETUP.sig" ]; then
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Haze-$V-setup.exe"
            node -e '
              const fs = require("fs");
              const [v, url, sig] = process.argv.slice(1);
              fs.writeFileSync("latest.json", JSON.stringify({
                version: v,
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": { url, signature: fs.readFileSync(sig, "utf8").trim() } },
              }, null, 2));
            ' "$V" "$URL" "$SETUP.sig"
            ARCHIVOS="$ARCHIVOS latest.json"
          fi

          cat > notas.md <<NOTAS
          Bajá \`Haze-$V-setup.exe\` y abrilo. Se instala solo para tu usuario, sin pedir permisos de administrador.

          Si ya tenés Haze, no hace falta: se actualiza sola de fondo.
          NOTAS
          gh release create "$GITHUB_REF_NAME" $ARCHIVOS --title "Haze $V" --notes-file notas.md
