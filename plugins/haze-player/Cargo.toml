[package]
name = "tauri-plugin-haze-player"
version = "0.1.0"
description = "Haze en Android: Media3/ExoPlayer con servicio en primer plano, y la biblioteca de MediaStore"
edition = "2021"
links = "tauri-plugin-haze-player"

[dependencies]
haze-core = { path = "../../crates/haze-core" }
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
# Las ordenes del reproductor van a Kotlin por JNI: sin Activity tambien (EngineBridge).
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
