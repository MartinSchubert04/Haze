# Workspace de Rust: la app de escritorio y el nucleo que va a compartir con Android
# (ver docs/mobile.md).
[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/haze-core"]

[profile.release]
# Binario chico (es lo que queda corriendo de fondo) sin que compilar tarde una
# eternidad: LTO "thin" en paralelo en vez de "fat" en un solo hilo.
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
